<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>منصة WOWTok - تسجيل الدخول</title>
    <style>
        body {
            font-family: sans-serif;
            background-color: #0b0f19;
            color: #ffffff;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
        }
        .login-card {
            background: #151c2c;
            padding: 30px;
            border-radius: 15px;
            width: 85%;
            max-width: 350px;
            text-align: center;
            border: 1px solid #1f2c47;
        }
        .logo {
            font-size: 26px;
            font-weight: bold;
            color: #00ffcc;
            margin-bottom: 20px;
        }
        input {
            width: 100%;
            padding: 12px;
            margin: 10px 0;
            border-radius: 8px;
            border: 1px solid #1f2c47;
            background: #0b0f19;
            color: white;
            box-sizing: border-box;
        }
        button {
            width: 100%;
            padding: 12px;
            background: #00ffcc;
            border: none;
            border-radius: 8px;
            color: #0b0f19;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
            margin-top: 15px;
        }
    </style>
</head>
<body>

<div class="login-card">
    <div class="logo">⚡ WOWTok VIP</div>
    <p style="color: #8fa0c2; font-size: 14px;">منصة استثمارية تجريبية مؤمنة</p>
    
    <input type="text" placeholder="اسم المستخدم أو البريد">
    <input type="password" placeholder="كلمة المرور">
    
    <button onclick="alert('أهلاً بك! الواجهة تعمل بنجاح، والخطوة القادمة هي ربط الأرباح.')">تسجيل الدخول</button>
</div>

</body>
</html>
