<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>سحب الأموال - WOWTok VIP</title>
    <style>
        body {
            font-family: sans-serif;
            background-color: #0b0f19;
            color: #ffffff;
            margin: 0;
            padding: 15px;
        }
        .header {
            text-align: center;
            padding: 15px;
            font-size: 20px;
            font-weight: bold;
            color: #ff4a5a;
            border-bottom: 1px solid #1f2c47;
            margin-bottom: 20px;
            position: relative;
        }
        .btn-back {
            position: absolute;
            right: 10px;
            top: 15px;
            color: #8fa0c2;
            text-decoration: none;
            font-size: 14px;
            border: 1px solid #1f2c47;
            padding: 4px 10px;
            border-radius: 5px;
            background: #151c2c;
        }
        .withdraw-card {
            background: #151c2c;
            border: 1px solid #1f2c47;
            padding: 20px;
            border-radius: 15px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.2);
        }
        .input-group {
            margin-bottom: 20px;
            text-align: right;
        }
        label {
            display: block;
            margin-bottom: 8px;
            font-size: 14px;
            color: #8fa0c2;
        }
        input {
            width: 100%;
            padding: 12px;
            border-radius: 8px;
            border: 1px solid #1f2c47;
            background: #0b0f19;
            color: white;
            box-sizing: border-box;
            font-size: 15px;
        }
        input:focus {
            border-color: #ff4a5a;
            outline: none;
        }
        .btn-withdraw {
            background: linear-gradient(135deg, #ff4a5a, #ff7684);
            color: white;
            border: none;
            width: 100%;
            padding: 14px;
            border-radius: 8px;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
            box-shadow: 0 4px 12px rgba(255, 74, 90, 0.3);
        }
        .info-text {
            font-size: 13px;
            color: #8fa0c2;
            margin-top: 5px;
        }
    </style>
</head>
<body>

    <!-- عنوان الصفحة مع زر العودة للرئيسية -->
    <div class="header">
        <a href="index.html" class="btn-back">🔙 عودة</a>
        📤 سحب الأرباح والرصيد
    </div>

    <!-- كارت نموذج طلب السحب -->
    <div class="withdraw-card">
        
        <!-- حقل عنوان المحفظة -->
        <div class="input-group">
            <label>عنوان محفظتك الرقمية الشخصية (USDT - TRC20)</label>
            <input type="text" id="walletAddress" placeholder="أدخل عنوان محفظتك لاستلام الأموال">
            <div class="info-text">تأكد من صحة العنوان تماماً، فالعمليات الرقمية لا يمكن التراجع عنها.</div>
        </div>

        <!-- حقل المبلغ المراد سحبه -->
        <div class="input-group">
            <label>المبلغ المراد سحبه (USDT)</label>
            <input type="number" id="withdrawAmount" placeholder="الحد الأدنى للسحب هو 10 USDT">
            <div class="info-text" style="color: #00ffcc;">الرصيد المتاح لديك حالياً: 25.50 USDT</div>
        </div>

        <!-- زر إرسال الطلب -->
        <button class="btn-withdraw" onclick="processWithdrawal()">تأكيد السحب الآمن</button>
    </div>

    <script>
        function processWithdrawal() {
            var address = document.getElementById("walletAddress").value;
            var amount = parseFloat(document.getElementById("withdrawAmount").value);
            var maxBalance = 25.50; 

            if (address === "" || isNaN(amount)) {
                alert("⚠️ يرجى ملء جميع الحقول (عنوان المحفظة والمبلغ).");
                return;
            }

            if (amount < 10) {
                alert("❌ عذراً، الحد الأدنى لعملية السحب هو 10 USDT.");
                return;
            }

            if (amount > maxBalance) {
                alert("❌ رصيدك الحالي غير كافٍ! الحد الأقصى المتاح للسحب هو 25.50 USDT.");
                return;
            }

            alert("✅ تم إرسال طلب السحب بنجاح لمبلغ " + amount + " USDT إلى المحفظة:\n" + address + "\n\nسيقوم النظام الأمني بمراجعته وتحويل الأموال خلال دقائق.");
            window.location.href = "index.html"; 
        }
    </script>

</body>
</html>
